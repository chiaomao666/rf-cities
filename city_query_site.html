<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RF 據點戰監測</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1a1a1a;
    --paper:#f8f6f0;
    --rule:#d4cfc4;
    --accent:#2e5c8a;
    --accent-light:#e8f0f8;
    --muted:#7a7570;
    --danger:#8b2e2e;
    --ok:#2e6b3e;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --serif:'Noto Serif TC', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:16px;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
  }

  /* 頂部橫幅 */
  .masthead{
    border-bottom:3px solid var(--ink);
    padding:20px 0 14px;
    text-align:center;
  }
  .masthead-inner{max-width:960px;margin:0 auto;padding:0 20px;}
  .masthead-tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--muted);text-transform:uppercase;margin-bottom:6px;
  }
  h1{
    font-size:clamp(28px, 5vw, 48px);font-weight:700;line-height:1.1;
    letter-spacing:-.01em;
  }
  .masthead-sub{
    font-family:var(--mono);font-size:12px;color:var(--muted);
    margin-top:6px;
  }
  .masthead-sub b{color:var(--accent);}

  /* 搜尋列 */
  .search-bar{
    max-width:960px;margin:24px auto;padding:0 20px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .search-bar input{
    flex:1;min-width:200px;
    border:1px solid var(--rule);border-radius:0;
    background:#fff;color:var(--ink);
    font-family:var(--serif);font-size:15px;
    padding:10px 14px;
  }
  .search-bar input:focus{outline:2px solid var(--accent);outline-offset:0;}
  .search-bar select{
    border:1px solid var(--rule);background:#fff;color:var(--ink);
    font-family:var(--serif);font-size:14px;padding:10px 10px;
  }
  .search-bar button{
    background:var(--ink);color:var(--paper);
    border:none;padding:10px 22px;cursor:pointer;
    font-family:var(--serif);font-size:14px;
  }
  .search-bar button:hover{background:var(--accent);}

  /* 統計列 */
  .stats-row{
    max-width:960px;margin:0 auto 18px;padding:0 20px;
    font-family:var(--mono);font-size:12px;color:var(--muted);
    display:flex;gap:20px;flex-wrap:wrap;
    border-bottom:1px solid var(--rule);padding-bottom:12px;
  }
  .stats-row b{color:var(--ink);}

  /* 城市表格 */
  .table-wrap{
    max-width:960px;margin:0 auto;padding:0 20px 60px;
    overflow-x:auto;
  }
  table{
    width:100%;border-collapse:collapse;
    font-size:14px;
  }
  thead th{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--muted);font-weight:500;
    border-bottom:2px solid var(--ink);
    padding:8px 10px;text-align:left;white-space:nowrap;
  }
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th .sort-arrow{
    display:inline-block;margin-left:4px;font-size:10px;color:var(--rule);
  }
  thead th.sort-active .sort-arrow{color:var(--accent);}
  tbody tr{border-bottom:1px solid var(--rule);}
  tbody tr:hover{background:var(--accent-light);}
  tbody td{padding:9px 10px;vertical-align:top;line-height:1.4;}
  .td-id{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .td-city{font-weight:600;color:var(--ink);}
  .td-chapter{color:var(--muted);font-size:13px;}
  .td-nation{
    display:inline-block;padding:2px 8px;
    background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;
  }
  .td-control{font-size:13px;color:var(--accent);}
  .td-time{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .td-energy{font-family:var(--mono);font-size:13px;}
  .empty-row td{text-align:center;color:var(--muted);padding:40px;font-size:14px;}

  /* 頁腳 */
  footer{
    border-top:1px solid var(--rule);
    padding:16px 20px;
    text-align:center;
    font-family:var(--mono);font-size:11px;color:var(--muted);
  }

  .loading{
    text-align:center;padding:60px 20px;
    font-family:var(--mono);font-size:13px;color:var(--muted);
  }
  .connection{max-width:960px;margin:16px auto 0;padding:0 20px;font-size:13px;color:var(--muted);line-height:1.8;}
  .connection strong{color:var(--accent);}
  .connection.error strong{color:var(--danger);}
  .connection button{margin-left:12px;padding:4px 10px;cursor:pointer;}
  .notice{max-width:960px;margin:0 auto 16px;padding:0 20px;font-size:12px;color:var(--muted);}
  tbody tr.changed{background:#fff0bd;}
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="masthead-tag">Reversed Front — 據點戰</div>
    <h1>進行中的據點戰</h1>
    <div class="masthead-sub">最新城市資料時間：<b id="lastUpdate">讀取中…</b></div>
  </div>
</div>

<div class="connection" id="connection" role="status" aria-live="polite">
  <strong id="connectionState">正在連線…</strong>
  <span id="syncTime"></span><button id="refreshBtn" type="button">立即同步</button>
</div>
<p class="notice">由獨立後端接收遊戲戰況，不需開啟遊戲或掛載模組。僅顯示交戰城市；後端斷線時保留的資料不代表最新戰況。</p>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜尋交戰城市名稱、城市 ID 或活動 ID…" />
  <select id="nationFilter">
    <option value="">所有國家</option>
  </select>
  <button id="searchBtn">查詢</button>
</div>

<div class="stats-row" id="statsRow">
  <span>交戰城市 <b id="totalCount">—</b> 座</span>
  <span>主權國家 <b id="nationCount">—</b> 個</span>
  <span>顯示 <b id="showCount">—</b> 筆</span>
</div>

<div class="table-wrap">
  <div class="loading" id="loadingMsg">正在從獨立後端讀取戰況…</div>
  <table id="cityTable" style="display:none;">
    <thead>
      <tr id="cityTableHeadRow">
        <th class="sortable" data-key="city_id">城市 ID<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="name">城市名稱<span class="sort-arrow"></span></th>
        <th>活動 ID</th>
        <th>報到倒數</th>
        <th>據點戰比分</th>
        <th class="sortable" data-key="updated_at">最後更新<span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="cityTableBody"></tbody>
  </table>
</div>

<footer>
  資料由遊戲側錄整理，僅供參考 ‧ 非官方網站
</footer>

<script>
(function(){
  const API_BASE = '';
  let sourceStatus = null;

  let allCities = [];
  let fetching = false;
  let refreshAgain = false;
  let realtimeReady = false;
  let socket = null;
  let heartbeat = null;
  let reconnect = null;
  let reference = 0;
  let failures = 0;
  let stopped = false;
  const changedAt = new Map();
  let sortState = { key: null, dir: "asc" }; // dir: "asc" | "desc"

  function parseBattle(value){
    if (typeof value === 'string'){
      try { value = JSON.parse(value); } catch { return null; }
    }
    return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
  }

  function activeBattle(city){
    // 與地圖交叉劍標記一致：sword 是戰鬥標記，knife 可能只是可發起攻擊。
    // 若採集端有明確的 sword 值，優先採用它；舊資料則讀取結構化戰況。
    if (city.sword === false || city.sword === 'false') return false;
    const battle = parseBattle(city.nation_battle);
    if (typeof battle?._rf_monitor?.active === 'boolean') return battle._rf_monitor.active;
    if (battle?.ended_at || battle?.finished_at || battle?.ended === true || battle?.finished === true) return false;
    if (city.sword === true || city.sword === 'true') return true;
    const score = String(city.nation_battle_score ?? '').trim();
    if (score && !['null', 'false', 'undefined'].includes(score)) return true;
    // 不以 close_roll_call_at 是否過期判斷結束，也不拿 knife 或國家 ID 當戰鬥依據。
    return Boolean(battle && (battle.id != null || battle.close_roll_call_at));
  }

  function countdown(city){
    const deadline = Date.parse(parseBattle(city.nation_battle)?.close_roll_call_at);
    if (!Number.isFinite(deadline)) return '未取得';
    const seconds = Math.ceil((deadline - Date.now()) / 1000);
    return seconds > 0 ? `${Math.floor(seconds / 60)}分 ${seconds % 60}秒` : '報到已截止';
  }

  function sortCities(cities){
    if (!sortState.key) return cities;
    const key = sortState.key;
    const dir = sortState.dir === "desc" ? -1 : 1;
    return cities.slice().sort((a, b) => {
      let av = a[key], bv = b[key];
      const aEmpty = av === null || av === undefined || av === "";
      const bEmpty = bv === null || bv === undefined || bv === "";
      if (aEmpty && bEmpty) return 0;
      if (aEmpty) return 1;  // 空值一律排到最後
      if (bEmpty) return -1;
      if (key === "updated_at") {
        av = new Date(av).getTime();
        bv = new Date(bv).getTime();
      } else if (typeof av === "number" || typeof bv === "number" || key === "city_id" || key === "control_union_id" || key === "chapter_number") {
        av = Number(av); bv = Number(bv);
        if (isNaN(av)) av = -Infinity;
        if (isNaN(bv)) bv = -Infinity;
      } else {
        av = String(av).toLowerCase();
        bv = String(bv).toLowerCase();
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function updateSortIndicators(){
    document.querySelectorAll('#cityTableHeadRow th.sortable').forEach(th => {
      const arrow = th.querySelector('.sort-arrow');
      if (th.dataset.key === sortState.key) {
        th.classList.add('sort-active');
        arrow.textContent = sortState.dir === "asc" ? "▲" : "▼";
      } else {
        th.classList.remove('sort-active');
        arrow.textContent = "▲▼";
      }
    });
  }

  async function fetchCities(){
    const resp = await fetch(API_BASE + '/api/battles', {cache:'no-store',signal:AbortSignal.timeout(15000)});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!Array.isArray(data.cities) || !data.status) throw new Error('後端資料格式錯誤');
    sourceStatus = data.status;
    return data.cities;
  }

  function formatTime(iso){
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function renderTable(cities){
    const tbody = document.getElementById("cityTableBody");
    document.getElementById("showCount").textContent = cities.length;

    if (cities.length === 0){
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">目前沒有符合條件、且已收到據點戰標記的城市</td></tr>';
      return;
    }

    tbody.innerHTML = cities.map(c => `
      <tr class="${Date.now() - (changedAt.get(String(c.city_id)) || 0) < 3000 ? 'changed' : ''}">
        <td class="td-id">${esc(c.city_id ?? '—')}</td>
        <td class="td-city">${esc(c.name || '—')}</td>
        <td class="td-id">${esc(parseBattle(c.nation_battle)?.id ?? '—')}</td>
        <td class="td-time" data-countdown-city="${esc(c.city_id)}">${esc(countdown(c))}</td>
        <td>${esc(parseBattle(c.nation_battle)?._rf_monitor?.score ?? c.nation_battle_score ?? '未取得')}</td>
        <td class="td-time">${formatTime(c.updated_at)}</td>
      </tr>
    `).join("");
  }


  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function applyFilter(){
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const nation = document.getElementById("nationFilter").value;
    let filtered = allCities.filter(activeBattle);
    if (q) filtered = filtered.filter(c =>
      String(c.city_id ?? '').toLowerCase().includes(q) ||
      (c.name || '').toLowerCase().includes(q) ||
      String(parseBattle(c.nation_battle)?.id ?? '').includes(q)
    );
    if (nation) filtered = filtered.filter(c => (c.control_nation_name || "") === nation);
    filtered = sortCities(filtered);
    renderTable(filtered);
  }

  function setConnection(text, error = false){
    document.getElementById("connectionState").textContent = text;
    document.getElementById("connection").classList.toggle("error", error);
  }

  async function refresh(){
    if (fetching){ refreshAgain = true; return; }
    fetching = true;
    const loadingMsg = document.getElementById("loadingMsg");
    const table = document.getElementById("cityTable");

    try {
      const next = await fetchCities();
      const previous = new Map(allCities.map(c => [String(c.city_id), JSON.stringify(c)]));
      if (previous.size) next.forEach(c => {
        if (previous.get(String(c.city_id)) !== JSON.stringify(c)) changedAt.set(String(c.city_id), Date.now());
      });
      allCities = next;
      failures = 0;

      // 統計
      const activeCities = allCities.filter(activeBattle);
      document.getElementById("totalCount").textContent = activeCities.length;
      const nations = [...new Set(activeCities.map(c => c.control_nation_name).filter(Boolean))].sort();
      document.getElementById("nationCount").textContent = nations.length;

      // 國家篩選下拉
      const sel = document.getElementById("nationFilter");
      const selected = sel.value;
      sel.replaceChildren(new Option("所有國家", ""));
      nations.forEach(n => {
        const opt = document.createElement("option");
        opt.value = n; opt.textContent = n;
        sel.appendChild(opt);
      });
      if (nations.includes(selected)) sel.value = selected;

      // 最後更新時間
      const latest = activeCities.reduce((a, c) => Date.parse(c.updated_at) > Date.parse(a || '1970-01-01') ? c.updated_at : a, null);
      document.getElementById("lastUpdate").textContent = latest ? formatTime(latest) : "無資料";

      loadingMsg.style.display = "none";
      table.style.display = "table";
      applyFilter();
      document.getElementById("syncTime").textContent = "同步於 " + new Date().toLocaleTimeString("zh-TW");
      const labels = {waiting_credentials:'後端尚未設定採集帳號',connecting:'後端正在連接遊戲',
        subscribing:'後端正在訂閱遊戲戰況',live:'後端已連上遊戲，持續接收戰況',
        reconnecting:'後端與遊戲斷線，正在重連；顯示資料可能已過期',auth_error:'遊戲拒絕連線，請檢查採集帳號權限'};
      setConnection((labels[sourceStatus?.state] || '後端狀態未知') + (sourceStatus?.error ? '：' + sourceStatus.error : ''), !sourceStatus?.connected);

    } catch (e) {
      failures++;
      setConnection("同步失敗：" + e.message + "；保留上次資料並自動重試", true);
      if (!allCities.length) loadingMsg.textContent = "讀取資料失敗：" + e.message;
    } finally {
      fetching = false;
      if (refreshAgain && !stopped){ refreshAgain = false; queueMicrotask(refresh); }
    }
  }

  function connectRealtime(){
    if (stopped) return;
    socket = new EventSource(API_BASE + '/api/events');
    socket.onopen = () => { realtimeReady = true; refresh(); };
    socket.addEventListener('change', refresh);
    socket.onerror = () => { realtimeReady = false; setConnection('網站與後端連線中斷，自動重連中', true); };
  }

  // 即時事件收到就更新；未啟用 Realtime 時每秒補查，失敗時逐步退避。
  async function poll(){
    if (stopped) return;
    await refresh();
    if (!stopped) setTimeout(poll, realtimeReady ? 60000 : Math.min(30000, 1000 * 2 ** Math.min(failures, 5)));
  }
  document.getElementById('refreshBtn').addEventListener('click', refresh);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('pagehide', () => { stopped = true; clearTimeout(reconnect); clearInterval(heartbeat); socket?.close(); });
  window.addEventListener('pageshow', event => { if (event.persisted){ stopped = false; connectRealtime(); poll(); } });

  document.getElementById("searchBtn").addEventListener("click", applyFilter);
  document.getElementById("searchInput").addEventListener("input", applyFilter);
  document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") applyFilter(); });
  document.getElementById("nationFilter").addEventListener("change", applyFilter);

  document.getElementById("cityTableHeadRow").addEventListener("click", e => {
    const th = e.target.closest("th.sortable");
    if (!th) return;
    const key = th.dataset.key;
    if (sortState.key === key) {
      sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
    } else {
      sortState.key = key;
      sortState.dir = "asc";
    }
    updateSortIndicators();
    applyFilter();
  });

  updateSortIndicators();
  // 只更新倒數文字，不重建表格，避免捲動與選取被打斷。
  setInterval(() => {
    const byId = new Map(allCities.map(c => [String(c.city_id), c]));
    document.querySelectorAll('[data-countdown-city]').forEach(el => {
      const city = byId.get(el.dataset.countdownCity);
      if (city) el.textContent = countdown(city);
    });
  }, 1000);
  connectRealtime();
  poll();
})();
</script>
</body>
</html>
