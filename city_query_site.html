<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RF 城市主權查詢</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1a1a1a;
    --paper:#f8f6f0;
    --rule:#d4cfc4;
    --accent:#2e5c8a;
    --accent-light:#e8f0f8;
    --muted:#7a7570;
    --danger:#8b2e2e;
    --ok:#2e6b3e;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --serif:'Noto Serif TC', serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:16px;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
  }

  /* 頂部橫幅 */
  .masthead{
    border-bottom:3px solid var(--ink);
    padding:20px 0 14px;
    text-align:center;
  }
  .masthead-inner{max-width:960px;margin:0 auto;padding:0 20px;}
  .masthead-tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--muted);text-transform:uppercase;margin-bottom:6px;
  }
  h1{
    font-size:clamp(28px, 5vw, 48px);font-weight:700;line-height:1.1;
    letter-spacing:-.01em;
  }
  .masthead-sub{
    font-family:var(--mono);font-size:12px;color:var(--muted);
    margin-top:6px;
  }
  .masthead-sub b{color:var(--accent);}

  /* 搜尋列 */
  .search-bar{
    max-width:960px;margin:24px auto;padding:0 20px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .search-bar input{
    flex:1;min-width:200px;
    border:1px solid var(--rule);border-radius:0;
    background:#fff;color:var(--ink);
    font-family:var(--serif);font-size:15px;
    padding:10px 14px;
  }
  .search-bar input:focus{outline:2px solid var(--accent);outline-offset:0;}
  .search-bar select{
    border:1px solid var(--rule);background:#fff;color:var(--ink);
    font-family:var(--serif);font-size:14px;padding:10px 10px;
  }
  .search-bar button{
    background:var(--ink);color:var(--paper);
    border:none;padding:10px 22px;cursor:pointer;
    font-family:var(--serif);font-size:14px;
  }
  .search-bar button:hover{background:var(--accent);}

  /* 統計列 */
  .stats-row{
    max-width:960px;margin:0 auto 18px;padding:0 20px;
    font-family:var(--mono);font-size:12px;color:var(--muted);
    display:flex;gap:20px;flex-wrap:wrap;
    border-bottom:1px solid var(--rule);padding-bottom:12px;
  }
  .stats-row b{color:var(--ink);}

  /* 城市表格 */
  .table-wrap{
    max-width:960px;margin:0 auto;padding:0 20px 60px;
    overflow-x:auto;
  }
  table{
    width:100%;border-collapse:collapse;
    font-size:14px;
  }
  thead th{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--muted);font-weight:500;
    border-bottom:2px solid var(--ink);
    padding:8px 10px;text-align:left;white-space:nowrap;
  }
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th .sort-arrow{
    display:inline-block;margin-left:4px;font-size:10px;color:var(--rule);
  }
  thead th.sort-active .sort-arrow{color:var(--accent);}
  tbody tr{border-bottom:1px solid var(--rule);}
  tbody tr:hover{background:var(--accent-light);}
  tbody td{padding:9px 10px;vertical-align:top;line-height:1.4;}
  .td-id{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .td-city{font-weight:600;color:var(--ink);}
  .td-chapter{color:var(--muted);font-size:13px;}
  .td-nation{
    display:inline-block;padding:2px 8px;
    background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;
  }
  .td-control{font-size:13px;color:var(--accent);}
  .td-time{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .td-energy{font-family:var(--mono);font-size:13px;}
  .td-infiltration{font-family:var(--mono);font-size:12px;color:var(--ok);white-space:nowrap;}
  .td-king{font-weight:600;color:var(--danger);white-space:nowrap;}
  .td-workstation{font-family:var(--mono);font-size:11px;color:var(--accent);white-space:nowrap;}
  .empty-row td{text-align:center;color:var(--muted);padding:40px;font-size:14px;}

  /* 頁腳 */
  footer{
    border-top:1px solid var(--rule);
    padding:16px 20px;
    text-align:center;
    font-family:var(--mono);font-size:11px;color:var(--muted);
  }

  .loading{
    text-align:center;padding:60px 20px;
    font-family:var(--mono);font-size:13px;color:var(--muted);
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="masthead-tag">Reversed Front — 城市資料</div>
    <h1>城市主權查詢</h1>
    <div class="masthead-sub">資料由玩家側錄整理，最後更新：<b id="lastUpdate">讀取中…</b></div>
  </div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="輸入城市 ID、城市名稱、主權國家或控制聯盟…" />
  <select id="nationFilter">
    <option value="">所有國家</option>
  </select>
  <button id="searchBtn">查詢</button>
</div>

<div class="stats-row" id="statsRow">
  <span>共 <b id="totalCount">—</b> 座城市</span>
  <span>主權國家 <b id="nationCount">—</b> 個</span>
  <span>顯示 <b id="showCount">—</b> 筆</span>
</div>

<div class="table-wrap">
  <div class="loading" id="loadingMsg">正在從資料庫讀取城市資料…</div>
  <table id="cityTable" style="display:none;">
    <thead>
      <tr id="cityTableHeadRow">
        <th class="sortable" data-key="city_id">城市 ID<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="name">城市名稱<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="title">劇情標題<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="chapter_number">章節<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="control_nation_name">主權國家<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="control_name">控制方<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="control_union_id">聯盟 ID<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="infiltration">滲透度<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="workstation_remaining_seconds">工作站剩餘<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="king_name">城市之王<span class="sort-arrow"></span></th>
        <th class="sortable" data-key="updated_at">最後更新<span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="cityTableBody"></tbody>
  </table>
</div>

<footer>
  資料由遊戲側錄整理，僅供參考 ‧ 非官方網站
</footer>

<script>
(function(){
  // ========== 設定區 ==========
  // 跟 city_uploader.js 填一樣的值
  const SUPABASE_URL = "https://bfecoizruicaaqxhmyqn.supabase.co";     // 例如 https://abcxyz.supabase.co
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmZWNvaXpydWljYWFxeGhteXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MjU1MzEsImV4cCI6MjEwNDMwMTUzMX0.k42rUGqjZSW77Nw4Ua9c2pBBjpZ-kGrttqvuiKX-I0c";    // 以 eyJ 開頭的那個 anon public key
  const TABLE_NAME = "cities";
  // ============================

  let allCities = [];
  let sortState = { key: null, dir: "asc" }; // dir: "asc" | "desc"

  function sortCities(cities){
    if (!sortState.key) return cities;
    const key = sortState.key;
    const dir = sortState.dir === "desc" ? -1 : 1;
    return cities.slice().sort((a, b) => {
      let av = a[key], bv = b[key];
      const aEmpty = av === null || av === undefined || av === "";
      const bEmpty = bv === null || bv === undefined || bv === "";
      if (aEmpty && bEmpty) return 0;
      if (aEmpty) return 1;  // 空值一律排到最後
      if (bEmpty) return -1;
      if (key === "updated_at") {
        av = new Date(av).getTime();
        bv = new Date(bv).getTime();
      } else if (typeof av === "number" || typeof bv === "number" || key === "city_id" || key === "control_union_id" || key === "chapter_number") {
        av = Number(av); bv = Number(bv);
        if (isNaN(av)) av = -Infinity;
        if (isNaN(bv)) bv = -Infinity;
      } else {
        av = String(av).toLowerCase();
        bv = String(bv).toLowerCase();
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function updateSortIndicators(){
    document.querySelectorAll('#cityTableHeadRow th.sortable').forEach(th => {
      const arrow = th.querySelector('.sort-arrow');
      if (th.dataset.key === sortState.key) {
        th.classList.add('sort-active');
        arrow.textContent = sortState.dir === "asc" ? "▲" : "▼";
      } else {
        th.classList.remove('sort-active');
        arrow.textContent = "▲▼";
      }
    });
  }

  async function fetchCities(){
    const resp = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*&order=updated_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    );
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    return resp.json();
  }

  function formatTime(iso){
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function renderTable(cities){
    const tbody = document.getElementById("cityTableBody");
    document.getElementById("showCount").textContent = cities.length;

    if (cities.length === 0){
      tbody.innerHTML = '<tr class="empty-row"><td colspan="11">沒有符合條件的城市資料</td></tr>';
      return;
    }

    tbody.innerHTML = cities.map(c => `
      <tr>
        <td class="td-id">${esc(c.city_id ?? '—')}</td>
        <td class="td-city">${esc(c.name || '—')}</td>
        <td class="td-chapter">${esc(c.title || '—')}</td>
        <td class="td-chapter">${esc(c.chapter_name || '—')}${c.chapter_number ? ' ch.' + c.chapter_number : ''}</td>
        <td><span class="td-nation">${esc(c.control_nation_name || '—')}</span></td>
        <td class="td-control">${esc(c.control_name || '—')}</td>
        <td class="td-id">${esc(c.control_union_id ?? '—')}</td>
        <td class="td-infiltration">${formatInfiltration(c.infiltration ?? c.uw_dominance)}</td>
        <td class="td-workstation">${formatRemaining(c.workstation_remaining_seconds, c.workstation_details)}</td>
        <td class="td-king">${esc(c.king_name || '—')}</td>
        <td class="td-time">${formatTime(c.updated_at)}</td>
      </tr>
    `).join("");
  }

  function formatInfiltration(value){
    if (value === null || value === undefined || value === '') return '—';
    let parsed = value;
    try { if (typeof value === 'string') parsed = JSON.parse(value); } catch (_) {}
    if (!parsed || typeof parsed !== 'object') return esc(value);
    return Object.entries(parsed)
      .map(([nation, points]) => `${esc(nation)}: ${esc(points)}%`)
      .join(' / ') || '—';
  }

  function formatRemaining(seconds, details){
    if (details) {
      try {
        const list = typeof details === 'string' ? JSON.parse(details) : details;
        const active = list.filter(ws => ws.remaining_seconds > 0);
        if (active.length) return active.map(ws => `${esc(ws.name || '工作站')} ${formatDuration(ws.remaining_seconds)}`).join(' / ');
      } catch (_) {}
    }
    return seconds === null || seconds === undefined ? '—' : formatDuration(seconds);
  }

  function formatDuration(seconds){
    const total = Math.max(0, Number(seconds) || 0);
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = Math.floor(total % 60);
    return hours ? `${hours} 小時 ${String(minutes).padStart(2, '0')} 分` : `${minutes}:${String(secs).padStart(2, '0')}`;
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function applyFilter(){
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const nation = document.getElementById("nationFilter").value;
    let filtered = allCities;
    if (q) filtered = filtered.filter(c =>
      String(c.city_id ?? '').toLowerCase().includes(q) ||
      (c.name || '').toLowerCase().includes(q) ||
      (c.title || '').toLowerCase().includes(q) ||
      (c.control_name || '').toLowerCase().includes(q) ||
      (c.control_nation_name || "").toLowerCase().includes(q) ||
      (c.king_name || '').toLowerCase().includes(q)
    );
    if (nation) filtered = filtered.filter(c => (c.control_nation_name || "") === nation);
    filtered = sortCities(filtered);
    renderTable(filtered);
  }

  async function init(){
    const loadingMsg = document.getElementById("loadingMsg");
    const table = document.getElementById("cityTable");

    try {
      allCities = await fetchCities();

      // 統計
      document.getElementById("totalCount").textContent = allCities.length;
      const nations = [...new Set(allCities.map(c => c.control_nation_name).filter(Boolean))].sort();
      document.getElementById("nationCount").textContent = nations.length;

      // 國家篩選下拉
      const sel = document.getElementById("nationFilter");
      nations.forEach(n => {
        const opt = document.createElement("option");
        opt.value = n; opt.textContent = n;
        sel.appendChild(opt);
      });

      // 最後更新時間
      const latest = allCities[0]?.updated_at;
      document.getElementById("lastUpdate").textContent = latest ? formatTime(latest) : "無資料";

      loadingMsg.style.display = "none";
      table.style.display = "table";
      renderTable(allCities);

    } catch (e) {
      loadingMsg.textContent = "讀取資料失敗：" + e.message + "（請確認 Supabase 設定是否正確）";
    }
  }

  document.getElementById("searchBtn").addEventListener("click", applyFilter);
  document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") applyFilter(); });
  document.getElementById("nationFilter").addEventListener("change", applyFilter);

  document.getElementById("cityTableHeadRow").addEventListener("click", e => {
    const th = e.target.closest("th.sortable");
    if (!th) return;
    const key = th.dataset.key;
    if (sortState.key === key) {
      sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
    } else {
      sortState.key = key;
      sortState.dir = "asc";
    }
    updateSortIndicators();
    applyFilter();
  });

  updateSortIndicators();
  init();
})();
</script>
</body>
</html>
