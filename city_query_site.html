<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逆統戰 · 即時據點戰地圖</title>
<link rel="stylesheet" href="./battle-map.css">
</head>
<body>
<canvas id="map" aria-label="逆統戰城市與據點戰地圖"></canvas>
<header class="panel toolbar">
<button id="menuToggle" class="menu-toggle" type="button" aria-label="開啟選單" aria-controls="siteMenu" aria-expanded="false"><span aria-hidden="true">☰</span></button>
<div><small>REVERSED FRONT · LIVE MAP</small><h1>逆統戰據點戰地圖</h1></div>
<form id="search"><input id="query" aria-label="搜尋城市" placeholder="搜尋城市名稱或 ID" autocomplete="off"><button>搜尋</button></form>
<label><input id="onlyBattle" type="checkbox">只顯示戰況</label>
<button id="refresh" type="button">更新</button>
</header>
<dialog id="siteMenu" class="site-menu" aria-labelledby="menuTitle">
<div class="menu-shell">
<div class="menu-heading"><h2 id="menuTitle">選單</h2><button id="menuClose" type="button" aria-label="關閉選單">✕</button></div>
<nav id="menuLinks" class="menu-links" aria-label="網站功能"><button id="openSettings" type="button"><span aria-hidden="true">⚙</span> 設定 <span aria-hidden="true">›</span></button><button id="openRoutePlanner" type="button"><span aria-hidden="true">⌁</span> 路線規劃 <span aria-hidden="true">›</span></button></nav>
<section id="menuSettings" class="menu-settings" hidden aria-label="地圖設定">
<button id="settingsBack" type="button">← 返回選單</button>
<h3>地圖顯示</h3>
<label><input id="settingsOnlyBattle" type="checkbox">只顯示戰況</label>
<label><input id="showRoutes" type="checkbox" checked>顯示推估城市連線</label>
<p id="routeInfo">正在讀取推估路線…</p>
<p>此設定只影響地圖顯示，不會停止即時資料更新。</p>
</section>
<p class="menu-note">逆統戰 · 即時據點戰地圖</p>
</div>
</dialog>
<aside class="panel battles"><h2>⚔ 據點戰</h2><p id="summary">正在讀取城市資料…</p><div id="battleList"></div></aside>
<section class="panel detail" id="detail" hidden></section>
<section class="panel route-plan" id="routePlan" hidden aria-labelledby="planTitle">
<div class="plan-heading"><h2 id="planTitle">路線規劃</h2><button id="planClose" type="button" aria-label="關閉路線規劃">✕</button></div>
<p id="planInfo" role="status"></p><div class="plan-actions"><button id="planToggle" type="button">暫停畫線</button><button id="planUndo" type="button">復原</button><button id="planClear" type="button">清除</button></div>
<ol id="planPoints" aria-label="規劃的途經點"></ol>
<p>黃色線是你的規劃，灰色線依舊圖推估；兩者皆不保證遊戲可以通行。</p><p id="planStorage"></p>
</section>
<nav class="panel zoom" aria-label="地圖縮放"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="縮小">－</button><button id="fit">全圖</button></nav>
<footer class="panel status"><span id="status" role="status">連線中…</span><span>⚔ 據點戰 · Oracle 持續採集</span></footer>
<script src="./monitor-config.js"></script>
<script src="./route-planner.js"></script>
<script>
(function(){
"use strict";
  let API_BASE = String(window.RF_MONITOR_CONFIG?.apiBase || '').trim().replace(/\/$/, '');
  let configError = '';
  const config = window.RF_MONITOR_CONFIG || {};
  const useSupabase = config.forceSupabase === true || (!API_BASE && /\.github\.io$/i.test(location.hostname));
  let supabaseUrl = '', publicKey = '', cloudUpdatedAt = null, supabaseClient = null;
  if (useSupabase) {
    try {
      const url = new URL(config.supabaseUrl);
      if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || url.pathname !== '/') throw new Error();
      publicKey = String(config.publishableKey || '').trim();
      let anon = false;
      try { anon = JSON.parse(atob(publicKey.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role === 'anon'; } catch {}
      if (!publicKey.startsWith('sb_publishable_') && !anon) throw new Error();
      supabaseUrl = url.origin;
    } catch { configError = '請在 monitor-config.js 設定 Supabase 網址與公開 publishable／anon 金鑰；不可使用私密寫入金鑰。'; }
  }
  if (!useSupabase && API_BASE) {
    try {
      const url = new URL(API_BASE);
      if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash)
        throw new Error('後端網址格式不正確');
      if (location.protocol === 'https:' && url.protocol !== 'https:') throw new Error('HTTPS 網站必須使用 HTTPS 後端');
      API_BASE = url.href.replace(/\/$/, '');
    } catch (e) { configError = e.message; }
  }

  let sourceStatus=null, allCities=[], cities=[], catalog=[];
let fetching=false,refreshAgain=false,realtimeReady=false,socket=null,reconnect=null,failures=0,stopped=false;
let scale=1,offsetX=0,offsetY=0,width=0,height=0,selected=null,frame=0,dragDistance=0,listSignature="",detailSignature="";
const CONFIG={background:"./portal-map.png",width:11036,height:7505};
const $=id=>document.getElementById(id);
const canvas=$("map"),ctx=canvas.getContext("2d"),pointers=new Map();
let backgroundImage=null,backgroundReady=false,inferredRoutes=[];
let routePlanner=null;
function setupMenu(){
 const menu=$("siteMenu"),toggle=$("menuToggle");
 function syncFilter(){ $("settingsOnlyBattle").checked=$("onlyBattle").checked; }
 function showSettings(open){
  $("menuLinks").hidden=open;$("menuSettings").hidden=!open;
  $("menuTitle").textContent=open?"設定":"選單";
  if(open)syncFilter();
 }
 toggle.onclick=()=>{
  showSettings(false);menu.showModal();toggle.setAttribute("aria-expanded","true");
  $("openSettings").focus();
 };
 $("menuClose").onclick=()=>menu.close();
 menu.addEventListener("click",event=>{if(event.target===menu)menu.close();});
 menu.addEventListener("close",()=>{toggle.setAttribute("aria-expanded","false");toggle.focus();});
 $("openSettings").onclick=()=>{showSettings(true);$("settingsBack").focus();};
 $("settingsBack").onclick=()=>{showSettings(false);$("openSettings").focus();};
 $("settingsOnlyBattle").onchange=()=>{ $("onlyBattle").checked=$("settingsOnlyBattle").checked;requestDraw(); };
 $("onlyBattle").addEventListener("change",syncFilter);
 $("showRoutes").onchange=requestDraw;
 $("openRoutePlanner").onclick=()=>{menu.close();routePlanner?.open();};
}
// 依陣營圖示的主色調整明度；只參考配色，不使用圖示素材。
// 控制陣營配色；不以主權國或城市所在地判定。
const NATION_COLORS={
 "紅軍":"#ff3732","香港":"#bd55f5","蒙古":"#008af7",
 "藏國":"#49cf87","哈薩克":"#00e2ca","維吾爾":"#9abaff",
 "滿洲":"#ffc400","滿州":"#ffc400","臺灣":"#08a2bc","台灣":"#08a2bc",
 "反賊聯盟":"#ffffff","無":"#808080"
};
function cityColor(city){return NATION_COLORS[city.control_nation_name]||"#808080";}
function attackerNation(city){
 const battle=parseBattle(city.nation_battle)||{};
 const code=typeof battle.nation_icon==="string"?battle.nation_icon.match(/^\/images\/nation\/color_icon\/minicoa\d{2}(CM|HK|MG|TB|KZ|UG|MC|TW|RB)\.png$/)?.[1]:null;
 // 圖示編號不等於遊戲陣營 ID，依字母代碼判定。
 return ({CM:"紅軍",HK:"香港",MG:"蒙古",TB:"藏國",KZ:"哈薩克",UG:"維吾爾",MC:"滿洲",TW:"臺灣",RB:"反賊聯盟"})[code]||battle._rf_monitor?.attacker_nation_name||null;
}
function attackerColor(city){
 const name=attackerNation(city);
 // 攻擊方未知時使用中性白色，不能誤用控制方（防守方）的顏色。
 return NATION_COLORS[name]||"#ffffff";
}
  function parseBattle(value){
    if (typeof value === 'string'){
      try { value = JSON.parse(value); } catch { return null; }
    }
    return value && typeof value === 'object' && !Array.isArray(value) ? value : null;
  }

  function activeBattle(city){
    // 與地圖交叉劍標記一致：sword 是戰鬥標記，knife 可能只是可發起攻擊。
    // 若採集端有明確的 sword 值，優先採用它；舊資料則讀取結構化戰況。
    if (city.sword === false || city.sword === 'false') return false;
    const battle = parseBattle(city.nation_battle);
    if (typeof battle?._rf_monitor?.active === 'boolean') return battle._rf_monitor.active;
    if (battle?.ended_at || battle?.finished_at || battle?.ended === true || battle?.finished === true) return false;
    if (city.sword === true || city.sword === 'true') return true;
    const score = String(city.nation_battle_score ?? '').trim();
    if (score && !['null', 'false', 'undefined'].includes(score)) return true;
    // 不以 close_roll_call_at 是否過期判斷結束，也不拿 knife 或國家 ID 當戰鬥依據。
    return Boolean(battle && (battle.id != null || battle.close_roll_call_at));
  }

  function countdown(city){
    const deadline = Date.parse(parseBattle(city.nation_battle)?.close_roll_call_at);
    if (!Number.isFinite(deadline)) return '未取得';
    const seconds = Math.ceil((deadline - Date.now()) / 1000);
    return seconds > 0 ? `${Math.floor(seconds / 60)}分 ${seconds % 60}秒` : '報到已截止';
  }


  async function fetchCities(){
    const headers = useSupabase ? {apikey:publicKey} : {};
    if (useSupabase && !publicKey.startsWith('sb_publishable_')) headers.Authorization = 'Bearer ' + publicKey;
    const endpoint = useSupabase ? supabaseUrl + '/rest/v1/battle_monitor_state?id=eq.1&select=cities,status,updated_at' : API_BASE + '/api/battles';
    const resp = await fetch(endpoint, {headers,cache:'no-store',signal:AbortSignal.timeout(15000)});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    let data = await resp.json();
    if (useSupabase) {
      if (!Array.isArray(data)) throw new Error('雲端資料格式錯誤');
      if (!data.length) throw new Error('等待採集主機首次發布戰況');
      data = data[0];
      cloudUpdatedAt = data.updated_at;
      if (!Number.isFinite(Date.parse(cloudUpdatedAt))) throw new Error('雲端更新時間無效');
    }
    if (!Array.isArray(data.cities) || !data.status) throw new Error('後端資料格式錯誤');
    sourceStatus = data.status;
    return data.cities;
  }


function stale(){
 return !sourceStatus?.connected || (useSupabase&&(!cloudUpdatedAt||Date.now()-Date.parse(cloudUpdatedAt)>90000));
}
function battleState(city){
 if(!activeBattle(city))return null;
 const battle=parseBattle(city.nation_battle)||{};
 const deadline=Date.parse(battle.close_roll_call_at);
 return {label:stale()?"上次戰況":deadline>Date.now()?"集結中":"交戰中",battle};
}
function mergeCity(base,live){
 const merged={...base,...live};
 const oldTime=Date.parse(base?.control_observed_at);
 const liveTime=Date.parse(live.updated_at);
 if(Number.isFinite(oldTime)&&(!Number.isFinite(liveTime)||liveTime<oldTime)){
  merged.control_nation_name=base.control_nation_name;
  merged.control_nation_id=base.control_nation_id;
  merged.control_union_id=base.control_union_id;
  merged.control_union_name=base.control_union_name;
 }else if(live.control_nation_name){
  merged.control_observed_at=live.updated_at;
  // 後端僅提供名稱時，不能沿用舊陣營的 ID。
  if(live.control_nation_id==null&&live.control_nation_name!==base?.control_nation_name)merged.control_nation_id=null;
 }
 return merged;
}
function rebuildCities(){
 const byId=new Map(catalog.map(c=>[String(c.city_id),{...c,nation_battle:null,nation_battle_score:null}]));
 for(const city of allCities)byId.set(String(city.city_id),mergeCity(byId.get(String(city.city_id)),city));
 // 結束後保留最後收到的控制陣營；戰況仍由即時快照獨立清除。
 catalog=catalog.map(c=>{
  const merged=byId.get(String(c.city_id));
  return {...c,control_nation_name:merged.control_nation_name,control_nation_id:merged.control_nation_id,
   control_union_id:merged.control_union_id,control_union_name:merged.control_union_name,control_observed_at:merged.control_observed_at};
 });
 cities=[...byId.values()];
 if(selected)selected=cities.find(c=>String(c.city_id)===String(selected.city_id))||null;
 renderBattleList();updateDetail();requestDraw();
}
function hasPosition(city){return city.x_position!=null&&city.y_position!=null&&Number.isFinite(Number(city.x_position))&&Number.isFinite(Number(city.y_position));}
function visibleCities(){return ($("onlyBattle").checked?cities.filter(activeBattle):cities).filter(hasPosition);}
    function requestDraw() {
        if (!frame) frame = requestAnimationFrame(draw);
    }
    function loadBackground(){
        if(typeof Image==="undefined")return;
        backgroundImage=new Image();
        backgroundImage.onload=()=>{backgroundReady=true;requestDraw();};
        backgroundImage.onerror=()=>setConnection("背景圖載入失敗；請重新整理頁面",true);
        backgroundImage.src=CONFIG.background;
    }
    async function loadRoutes(){
        try{
            const response=await fetch("./inferred-routes.json",{cache:"no-cache"});if(!response.ok)throw new Error("HTTP "+response.status);
            const data=await response.json();
            if(!Array.isArray(data.routes)||data.authoritative!==false)throw new Error("格式錯誤");
            inferredRoutes=data.routes.filter(r=>Number.isSafeInteger(r.from)&&Number.isSafeInteger(r.to)&&r.from!==r.to);
            $("routeInfo").textContent=`${inferredRoutes.length} 條推估連線；實線／虛線參考提供的地圖，不保證可通行。`;requestDraw();
        }catch{$("routeInfo").textContent="推估路線載入失敗；仍可手動規劃。";}
    }
    function drawInferredRoutes(){
        if(!$("showRoutes").checked||!inferredRoutes.length)return;
        const byId=new Map(cities.filter(hasPosition).map(c=>[c.city_id,c]));
        ctx.save();
        for(const style of ["solid","dashed"]){
            ctx.beginPath();ctx.setLineDash(style==="dashed"?[4,4]:[]);
            for(const route of inferredRoutes){
                if((route.style==="dashed"?"dashed":"solid")!==style)continue;
                const a=byId.get(route.from),b=byId.get(route.to);if(!a||!b)continue;
                ctx.moveTo(offsetX+a.x_position*scale,offsetY+a.y_position*scale);ctx.lineTo(offsetX+b.x_position*scale,offsetY+b.y_position*scale);
            }
            ctx.strokeStyle=style==="dashed"?"rgba(199,220,230,.50)":"rgba(235,242,239,.64)";
            ctx.lineWidth=style==="dashed"?1:1.35;ctx.stroke();
        }
        ctx.restore();
    }
    function draw() {
        frame = 0;
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#081614"; ctx.fillRect(0, 0, width, height);
        if(backgroundReady)ctx.drawImage(backgroundImage,offsetX,offsetY,CONFIG.width*scale,CONFIG.height*scale);
        drawInferredRoutes();
        const pulse = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : (Math.sin(Date.now()/350) + 1)/2;
        ctx.textAlign = "center";
        for (const city of visibleCities()) {
            const x = offsetX + city.x_position * scale, y = offsetY + city.y_position * scale;
            if (x < -80 || y < -40 || x > width + 80 || y > height + 40) continue;
            const battle = battleState(city);
            ctx.beginPath();ctx.arc(x,y,selected===city?7:4,0,Math.PI*2);
            ctx.fillStyle=cityColor(city);ctx.fill();
            if(selected===city){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();}
            if (battle) {
                ctx.beginPath(); ctx.arc(x,y,13+pulse*9,0,Math.PI*2);
                ctx.strokeStyle = stale()?`rgba(224,177,92,${.8-pulse*.4})`:`rgba(255,86,87,${.8-pulse*.4})`;ctx.lineWidth=2;ctx.stroke();
                ctx.save();
                ctx.font="bold 25px sans-serif";ctx.fillStyle=attackerColor(city);
                ctx.shadowColor="rgba(255,255,255,.9)";ctx.shadowBlur=7;
                ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=1;
                ctx.strokeText("⚔",x,y+8);ctx.fillText("⚔",x,y+8);
                ctx.restore();
            }
            if (scale > .12 || battle || selected===city) {
                ctx.font="600 12px sans-serif";ctx.lineWidth=4;ctx.strokeStyle="#071412";
                ctx.strokeText(city.name || String(city.city_id),x,y+27);
                ctx.fillStyle=battle?(stale()?"#e0b15c":"#ffbdbd"):"#fff";ctx.fillText(city.name || String(city.city_id),x,y+27);
            }
        }
        routePlanner?.draw(ctx,{scale,offsetX,offsetY});
    }
    function zoom(factor,x=width/2,y=height/2) {
        const next = Math.max(.035,Math.min(2,scale*factor)), ratio=next/scale;
        offsetX=x-(x-offsetX)*ratio;offsetY=y-(y-offsetY)*ratio;scale=next;requestDraw();
    }
    function fit() {
        scale=Math.max(.035,Math.min(width/CONFIG.width,height/CONFIG.height)*.94);
        offsetX=(width-CONFIG.width*scale)/2;offsetY=(height-CONFIG.height*scale)/2;requestDraw();
    }
    function resize() {
        width=innerWidth;height=innerHeight;
        canvas.width=Math.round(width*(devicePixelRatio||1));canvas.height=Math.round(height*(devicePixelRatio||1));requestDraw();
    }

function focusCity(city){
 selected=city;
 if(hasPosition(city)){scale=Math.max(scale,.4);offsetX=width/2-Number(city.x_position)*scale;offsetY=height/2-Number(city.y_position)*scale;}
 $("detail").hidden=false;detailSignature="";updateDetail();requestDraw();
}
function updateDetail(){
 const detail=$("detail");if(detail.hidden||!selected)return;
 const city=selected,battle=battleState(city);
 const signature=JSON.stringify([city,battle?.label,battle?countdown(city):null]);
 if(signature===detailSignature)return;detailSignature=signature;detail.replaceChildren();
 const close=document.createElement("button");close.textContent="關閉";close.onclick=()=>{detail.hidden=true;};
 const title=document.createElement("h2");title.textContent=city.name||String(city.city_id);
 const text=document.createElement("p");
 text.textContent=`城市 #${city.city_id}\n${battle?"⚔ "+battle.label:"目前沒有據點戰標記"}\n控制陣營：${city.control_nation_name||"未知"}`;
 text.textContent+=`\n控制聯盟：${city.control_union_name||"未取得"}\n聯盟 ID：${city.control_union_id??"未取得"}`;
 text.textContent+=`\n主權：${city.sovereign||"未知"}`;
 if(city.control_observed_at)text.textContent+=`\n控制資料時間：${new Date(city.control_observed_at).toLocaleString("zh-TW")}`;
 if(battle){text.textContent+=`\n活動 ID：${battle.battle.id??"未取得"}\n報到倒數：${countdown(city)}\n比分：${battle.battle._rf_monitor?.score??city.nation_battle_score??"未取得"}\n更新：${city.updated_at?new Date(city.updated_at).toLocaleString("zh-TW"):"未知"}`;}
 if(battle)text.textContent+=`\n攻擊方：${attackerNation(city)||"未取得"}`;
 if(!hasPosition(city))text.textContent+="\n尚未取得城市座標";
 detail.append(close,title,text);
}
function battleListText(city){
 const state=battleState(city);
 const label=state.label==="集結中"?`${state.label}（${countdown(city)}）`:state.label;
 return `${label} · 比分 ${state.battle._rf_monitor?.score??"未取得"}`;
}
function renderBattleList(){
 const active=cities.filter(activeBattle),list=$("battleList");
 $("summary").textContent=`${cities.filter(hasPosition).length} 座城市 · ${active.length} 處${stale()?"上次":"即時"}戰況`;
 const signature=JSON.stringify(active.map(c=>[c.city_id,c.name,battleState(c).label,c.nation_battle,c.updated_at,attackerNation(c)]));
 if(signature===listSignature){
  // 倒數只更新文字，不每秒重建按鈕，保留焦點與捲動位置。
  active.forEach((city,i)=>{
   const small=list.children[i]?.children[0],text=battleListText(city);
   if(small&&small.textContent!==text)small.textContent=text;
  });
  return;
 }
 listSignature=signature;list.replaceChildren();
 for(const city of active){
   const button=document.createElement("button");button.className="battle";button.textContent=`⚔ ${city.name||city.city_id}`;
   const attacker=attackerNation(city);
   button.style.setProperty("--attacker-color",NATION_COLORS[attacker]||"#808080");
   button.title=`攻擊方：${attacker||"未取得"}`;
   const small=document.createElement("small");small.textContent=battleListText(city);
   button.append(small);button.onclick=()=>focusCity(city);list.append(button);
 }
 if(!active.length)list.textContent=sourceStatus?.connected?"目前沒有收到據點戰標記。":"等待 Oracle 採集主機的戰況。";
}
function setConnection(text,error=false){$("status").textContent=text;$("status").classList.toggle("error",error);}
function showSourceStatus(){
 if(useSupabase&&cloudUpdatedAt&&Date.now()-Date.parse(cloudUpdatedAt)>90000){
  setConnection("採集主機超過 90 秒未回報；雙刀顯示上次戰況，資料可能過期",true);return;
 }
 const labels={waiting_credentials:"採集主機尚未設定帳號",connecting:"Oracle 正在連接遊戲",subscribing:"Oracle 正在訂閱戰況",live:"Oracle 已連上遊戲，持續接收戰況",reconnecting:"Oracle 與遊戲斷線，正在重連；資料可能過期",auth_error:"遊戲拒絕採集主機連線"};
 setConnection((labels[sourceStatus?.state]||"等待採集主機")+(sourceStatus?.error?"："+sourceStatus.error:"")+
 (cloudUpdatedAt?" · 更新 "+new Date(cloudUpdatedAt).toLocaleTimeString("zh-TW"):"")+(realtimeReady?" · 即時通知已連接":" · 自動補查"),!sourceStatus?.connected);
}
async function refresh(){
 if(stopped||configError)return;
 if(fetching){refreshAgain=true;return;}fetching=true;$("refresh").disabled=true;
 try{allCities=await fetchCities();failures=0;rebuildCities();showSourceStatus();}
 catch(error){failures++;setConnection("同步失敗："+error.message+"；保留上次戰況並自動重試",true);}
 finally{fetching=false;$("refresh").disabled=false;if(refreshAgain&&!stopped){refreshAgain=false;queueMicrotask(refresh);}}
}
  async function connectRealtime(){
    if (stopped) return;
    if (useSupabase) {
      try {
        const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        if (stopped) return;
        supabaseClient ||= createClient(supabaseUrl,publicKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
        socket = supabaseClient.channel('rf-city-battles')
          .on('postgres_changes',{event:'*',schema:'public',table:'battle_monitor_state',filter:'id=eq.1'},()=>{if (!stopped) refresh();})
          .subscribe(state=>{
            if (stopped) return;
            realtimeReady = state === 'SUBSCRIBED';
            if (realtimeReady) refresh();
            else if (['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(state)) setConnection('雲端即時通知中斷，改用自動補查',true);
          });
      } catch {realtimeReady=false;setConnection('即時通知尚未連上，使用自動補查',true);}
      return;
    }
    socket = new EventSource(API_BASE + '/api/events');
    socket.onopen = () => { realtimeReady = true; refresh(); };
    socket.addEventListener('change', refresh);
    socket.onerror = () => { realtimeReady = false; setConnection('網站與後端連線中斷，自動重連中', true); };
  }

  // 即時事件收到就更新；未啟用 Realtime 時每秒補查，失敗時逐步退避。
  async function poll(){
    if (stopped) return;
    await refresh();
    if (!stopped) reconnect = setTimeout(poll, realtimeReady ? 60000 : Math.min(30000, 1000 * 2 ** Math.min(failures, 5)));
  }

async function loadCatalog(){
 try{
  const response=await fetch("./cities-map.json",{cache:"no-cache"});if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();if(!Array.isArray(data))throw new Error("座標格式錯誤");
  catalog=data.filter(c=>c&&c.city_id!=null);rebuildCities();
 }catch(error){$("summary").textContent="城市座標載入失敗："+error.message;}
}
    canvas.addEventListener("wheel",event=>{event.preventDefault();zoom(Math.exp(-event.deltaY*.001),event.clientX,event.clientY);},{passive:false});
    canvas.addEventListener("pointerdown",event=>{canvas.setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});dragDistance=0;});
    canvas.addEventListener("pointermove",event=>{
        const previous=pointers.get(event.pointerId);if(!previous)return;
        const next={x:event.clientX,y:event.clientY};
        if(pointers.size===2){
            const other=[...pointers.entries()].find(([id])=>id!==event.pointerId)[1];
            const oldDistance=Math.hypot(previous.x-other.x,previous.y-other.y),newDistance=Math.hypot(next.x-other.x,next.y-other.y);
            if(oldDistance>0)zoom(newDistance/oldDistance,(next.x+other.x)/2,(next.y+other.y)/2);
            dragDistance+=10;
        } else {const dx=next.x-previous.x,dy=next.y-previous.y;offsetX+=dx;offsetY+=dy;dragDistance+=Math.hypot(dx,dy);requestDraw();}
        pointers.set(event.pointerId,next);
    });
    canvas.addEventListener("pointerup",event=>{
        if(dragDistance<6&&pointers.size===1){
            let nearest=null,distance=routePlanner?.active?14:25;
            for(const city of (routePlanner?.active?cities.filter(hasPosition):visibleCities())){
                const d=Math.hypot(offsetX+city.x_position*scale-event.clientX,offsetY+city.y_position*scale-event.clientY);
                if(d<distance){nearest=city;distance=d;}
            }
            if(routePlanner?.active){
                const x=(event.clientX-offsetX)/scale,y=(event.clientY-offsetY)/scale;
                routePlanner.addPoint(nearest?{x:Number(nearest.x_position),y:Number(nearest.y_position),city_id:nearest.city_id,name:nearest.name||String(nearest.city_id)}:{x,y,name:"自訂位置",city_id:null});
            }else if(nearest)focusCity(nearest);
        }
        pointers.delete(event.pointerId);
    });
    canvas.addEventListener("pointercancel",event=>pointers.delete(event.pointerId));
    $("zoomIn").onclick=()=>zoom(1.4);$("zoomOut").onclick=()=>zoom(1/1.4);$("fit").onclick=fit;
    $("refresh").onclick=refresh;$("onlyBattle").onchange=requestDraw;
    $("search").onsubmit=event=>{
        event.preventDefault();const query=$("query").value.trim();if(!query)return;
        const city=cities.find(c=>String(c.city_id)===query||c.name===query)||cities.find(c=>c.name&&c.name.includes(query));
        if(city)focusCity(city);else $("status").textContent=`找不到城市「${query}」`;
    };

setupMenu();
if(window.RFRoutePlanner)routePlanner=new window.RFRoutePlanner({width:CONFIG.width,height:CONFIG.height,onChange:()=>{canvas.classList.toggle("planning",routePlanner?.active);requestDraw();}});
loadBackground();loadRoutes();
addEventListener("resize",resize);resize();fit();loadCatalog();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});
addEventListener("pagehide",()=>{stopped=true;realtimeReady=false;clearTimeout(reconnect);if(useSupabase){if(socket)supabaseClient?.removeChannel(socket);}else socket?.close();});
addEventListener("pageshow",event=>{if(event.persisted&&!configError){stopped=false;connectRealtime();poll();}});
setInterval(()=>{if(!document.hidden&&!stopped){renderBattleList();updateDetail();requestDraw();if(sourceStatus&&!failures)showSourceStatus();}},1000);
setInterval(()=>{if(!document.hidden&&!stopped&&cities.some(activeBattle))requestDraw();},250);
if(configError){setConnection(configError,true);$("refresh").disabled=true;}else{connectRealtime();poll();}
})();
